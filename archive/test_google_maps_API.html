<!DOCTYPE html>
<html>
  <head>
    <title>My Location Map Test</title>
    <style>
      #map { height: 100%; }
      html, body { height: 100%; margin: 0; padding: 0; }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script>
      function initMap() {
        // Default to New York in case location access is denied
        var defaultLocation = {lat: 40.7128, lng: -74.0060}; 

        var map = new google.maps.Map(document.getElementById('map'), {
          zoom: 15,
          center: defaultLocation
        });

        // HTML5 Geolocation to find YOU
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(function(position) {
            var pos = {
              lat: position.coords.latitude,
              lng: position.coords.longitude
            };

            // Center map on your location and add a marker
            map.setCenter(pos);
            new google.maps.Marker({
              position: pos,
              map: map,
              title: "You are here!"
            });

          }, function() {
            handleLocationError(true, map.getCenter());
          });
        } else {
          // Browser doesn't support Geolocation
          handleLocationError(false, map.getCenter());
        }
      }

      function handleLocationError(browserHasGeolocation, pos) {
        console.log(browserHasGeolocation ?
                      'Error: The Geolocation service failed.' :
                      'Error: Your browser doesn\'t support geolocation.');
      }
    </script>

    <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBoZjq4ufG2vO9k5UGJZ_yFxP3YKCqtsfQ&callback=initMap">
    </script>
  </body>
</html>
