services:
  - type: web
    name: attendance-system-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://attendance-system-client-jk9s.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://attendance-system-client-jk9s.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
